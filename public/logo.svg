<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Dense">
  <title>Dense</title>
  <!-- The same cube as the favicon, drawn larger: a dark machined block with one lit
       face. It is the whole product in one shape, so it is the mark. -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d1d8"/>
      <stop offset="1" stop-color="#96a0a9"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b636b"/>
      <stop offset="1" stop-color="#434a51"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4046"/>
      <stop offset="1" stop-color="#2a3036"/>
    </linearGradient>
  </defs>
  <path d="M48 10 78 27.5v35L48 80 18 62.5v-35z" fill="url(#right)"/>
  <path d="M48 10 78 27.5 48 45 18 27.5z" fill="url(#top)"/>
  <path d="M48 45v35L18 62.5v-35z" fill="url(#left)"/>
  <path d="M48 10 78 27.5v35L48 80 18 62.5v-35z" fill="none" stroke="#0f151c" stroke-width="2" stroke-linejoin="round"/>
</svg>
