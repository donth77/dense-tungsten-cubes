<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Dense · calibration</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f151c;
        overscroll-behavior: none;
      }
      #app {
        height: 100dvh;
        position: relative;
        overflow: hidden;
      }
      canvas#stage {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #readout {
        position: absolute;
        left: 12px;
        bottom: 12px;
        font:
          600 11px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #9aa7b2;
        background: #1b232d;
        border: 1px solid #49575f;
        border-radius: 3px;
        padding: 10px 12px;
        white-space: pre;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      #readout b {
        color: #dbe3ea;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="ui"></div>
      <div id="readout">booting…</div>
    </div>
    <script type="module" src="/src/calibrate.ts"></script>
  </body>
</html>
